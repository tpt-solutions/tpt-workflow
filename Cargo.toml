[workspace]
resolver = "2"
members = [
    "crates/tpt-workflow-core",
    "crates/tpt-workflow-proto",
    "crates/tpt-workflow-sandbox",
    "crates/tpt-workflow-builder",
]
exclude = []

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["full"] }
tonic = { version = "0.11", features = ["tls", "tls-roots", "transport"] }
prost = { version = "0.12", features = ["prost-derive"] }
prost-types = { version = "0.12" }
prost-reflect = { version = "0.12" }
prost-build = "0.12"
tonic-build = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.6"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-log = "0.2"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
axum = { version = "0.7", features = ["ws", "json"] }
hyper = { version = "1.0", features = ["full"] }
http = "1"
bytes = "1.5"
uuid = { version = "1.6", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "3.0", features = ["serde"] }
rand = { version = "0.8", features = ["std"] }
parking_lot = "0.12"
dashmap = "5.5"
arc-swap = "1.6"
once_cell = "1.19"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
async-trait = "0.1"
wasmtime = { version = "25", features = ["parallel-compilation", "cranelift"] }
sha2 = "0.10"
semver = "1.0"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true